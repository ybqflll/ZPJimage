<script type="text/babel" data-presets="react">
const { useState, useRef, useEffect, useMemo } = React;
const { motion, useScroll, useTransform } = window.Motion;

/* ============================================================
   运行时站点配置 SITE：默认值见各数据数组，已在下方填充；可在隐藏后台修改
   ============================================================ */
let SITE = {
  heroTitle: '',
  heroSub: '',
  nav: [],
  contactLabel: '',
  contactUrl: '#contact',
  aboutHeading: '',
  about1: '',
  about2: '',
  replayLabel: '',
  servicesHeading: '',
  projectsHeading: '',
  liveLabel: '',
  heroPortrait: '',
  aboutImages: {},
  marquee: [],
  services: [],
  projects: [],
};
(function loadSavedConfig() {
  try {
    const raw = localStorage.getItem('ling-portfolio-config');
    if (raw) {
      const saved = JSON.parse(raw);
      SITE = Object.assign(SITE, saved);
    }
  } catch (e) { /* 忽略损坏配置 */ }
})();

/* ============================================================
   Placeholder feedback for demo links (keeps every button live)
   ============================================================ */
let toastTimer = null;
function showToast(msg) {
  let el = document.getElementById('demo-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'demo-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:linear-gradient(123deg,#18011F 7%,#B600A8 37%,#7621B0 72%,#BE4C00 100%);color:#fff;border-radius:9999px;padding:10px 22px;font-family:Kanit,sans-serif;font-size:13px;letter-spacing:0.08em;text-transform:uppercase;z-index:9999;opacity:0;transition:opacity .3s ease;pointer-events:none;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.35);';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.style.opacity = '0'; }, 2400);
}

/* ============================================================
   FadeIn — Framer Motion scroll-reveal wrapper
   ============================================================ */
const FadeIn = ({ children, delay = 0, duration = 0.7, x = 0, y = 30, as = 'div', className = '', style = {} }) => {
  const Comp = useMemo(
    () => (typeof motion.create === 'function' ? motion.create(as) : motion(as)),
    [as]
  );
  return (
    <Comp
      className={className}
      style={style}
      initial={{ opacity: 0, x, y }}
      whileInView={{ opacity: 1, x: 0, y: 0 }}
      viewport={{ once: true, margin: '50px', amount: 0 }}
      transition={{ duration, delay, ease: [0.25, 0.1, 0.25, 1] }}
    >
      {children}
    </Comp>
  );
};

/* ============================================================
   Magnet — mouse-following magnetic hover effect
   ============================================================ */
const Magnet = ({
  children,
  padding = 100,
  strength = 2,
  activeTransition = 'transform 0.3s ease-out',
  inactiveTransition = 'transform 0.6s ease-in-out',
  className = '',
  style = {},
}) => {
  const ref = useRef(null);
  const [isActive, setIsActive] = useState(false);
  const [position, setPosition] = useState({ x: 0, y: 0 });

  const handleMouseMove = (e) => {
    const el = ref.current;
    if (!el) return;
    const rect = el.getBoundingClientRect();
    const centerX = rect.left + rect.width / 2;
    const centerY = rect.top + rect.height / 2;
    const distX = Math.abs(e.clientX - centerX);
    const distY = Math.abs(e.clientY - centerY);
    const active = distX < rect.width / 2 + padding && distY < rect.height / 2 + padding;
    setIsActive(active);
    if (active) {
      setPosition({
        x: (e.clientX - centerX) / strength,
        y: (e.clientY - centerY) / strength,
      });
    }
  };

  return (
    <div
      ref={ref}
      onMouseMove={handleMouseMove}
      onMouseLeave={() => { setIsActive(false); setPosition({ x: 0, y: 0 }); }}
      className={className}
      style={{
        position: 'relative',
        display: 'inline-block',
        transform: `translate3d(${position.x}px, ${position.y}px, 0)`,
        transition: isActive ? activeTransition : inactiveTransition,
        willChange: 'transform',
        ...style,
      }}
    >
      {children}
    </div>
  );
};

/* ============================================================
   AnimatedText — character-by-character scroll-reveal
   ============================================================ */
const Character = ({ char, progress, range }) => {
  const opacity = useTransform(progress, range, [0.2, 1]);
  return (
    <span className="relative inline-block">
      <span className="invisible">{char}</span>
      <motion.span style={{ opacity }} className="absolute left-0 top-0">{char}</motion.span>
    </span>
  );
};

const AnimatedText = ({ text, className = '' }) => {
  const ref = useRef(null);
  const { scrollYProgress } = useScroll({ target: ref, offset: ['start 0.8', 'end 0.2'] });
  const words = text.split(' ');
  return (
    <p ref={ref} className={className}>
      {words.map((word, wi) => (
        <span key={wi} className="inline-block">
          {word.split('').map((char, ci) => {
            const start = wi / words.length + ci / (word.length * words.length);
            const end = start + 1 / words.length;
            return <Character key={ci} char={char} progress={scrollYProgress} range={[start, end]} />;
          })}
          {wi < words.length - 1 ? <span>&nbsp;</span> : null}
        </span>
      ))}
    </p>
  );
};

/* ============================================================
   Buttons
   ============================================================ */
const ContactButton = ({ className = '' }) => (
  <a
    href={SITE.contactUrl || '#contact'}
    onClick={(e) => { e.preventDefault(); const el = document.getElementById('contact'); if (el) el.scrollIntoView({ behavior: 'smooth' }); }}
    className={`inline-block rounded-full text-white font-medium uppercase tracking-widest px-8 py-3 sm:px-10 sm:py-3.5 md:px-12 md:py-4 text-xs sm:text-sm md:text-base ${className}`}
    style={{
      background: 'linear-gradient(123deg, #18011F 7%, #B600A8 37%, #7621B0 72%, #BE4C00 100%)',
      boxShadow: '0px 4px 4px rgba(181, 1, 167, 0.25), 4px 4px 12px #7721B1 inset',
      outline: '2px solid #FFFFFF',
      outlineOffset: '-3px',
    }}
  >
    {SITE.contactLabel || 'Contact Me'}
  </a>
);

const LiveProjectButton = ({ projectIndex, className = '' }) => (
  <a
    href={`#project-0${projectIndex + 1}`}
    onClick={() => { savedScrollY = window.scrollY; }}
    className={`inline-block rounded-full border-2 border-[#D7E2EA] text-[#D7E2EA] font-medium uppercase tracking-widest px-8 py-3 sm:px-10 sm:py-3.5 text-sm sm:text-base hover:bg-[#D7E2EA]/10 transition-colors duration-200 ${className}`}
  >
    {SITE.liveLabel || 'Live Project'}
  </a>
);

/* ============================================================
   1. HERO SECTION
   ============================================================ */
/* ============================================================
   HERO CRYSTAL BALL — CrystalizedBall (React Bits Pro) 原生 WebGL2 移植
   注入到作品集 hero：替换原人物图。IIFE 包裹避免与主文件命名冲突。
   ============================================================ */
const CrystalBallBoot = (() => {
  const BALL_PRESETS = {
    plasma:  { color:'#F25BD0', strands:6, crackle:0.85, flares:0.65, glow:0.9,  sparks:0.6, particleCount:15000, fill:0.5, motion:'rise',  particleShape:'square', depth:0.6, sway:0.5, twinkle:0.5, haze:0.7, dustSpeed:1 },
    aurora:  { color:'#5CFFC8', strands:5, crackle:0.6,  flares:0.5,  glow:0.8,  sparks:0.45, particleCount:15000, fill:0.5, motion:'rise',  particleShape:'square', depth:0.6, sway:0.5, twinkle:0.5, haze:0.7, dustSpeed:1 },
    nebula:  { color:'#9478FF', strands:6, crackle:1,    flares:0.5,  glow:0.9,  sparks:0.6, particleCount:18000, fill:0.45, motion:'rise', particleShape:'square', depth:0.5, sway:0.4, twinkle:0.6, haze:0.8, dustSpeed:1.2 },
    ember:   { color:'#FF8A2A', strands:5, crackle:0.9,  flares:0.8,  glow:1,    sparks:0.8, particleCount:12000, fill:0.35, motion:'rise', particleShape:'round', depth:0.7, sway:0.3, twinkle:0.7, haze:0.9, dustSpeed:1.6 },
    frost:   { color:'#BFE6FF', strands:3, crackle:0.3,  flares:0.3,  glow:0.6,  sparks:0.2, particleCount:16000, fill:0.6, motion:'fall',  particleShape:'round', depth:0.8, sway:0.4, twinkle:0.4, haze:0.5, dustSpeed:0.7 },
    solar:   { color:'#FFD36E', strands:6, crackle:0.7,  flares:1,    glow:1.1,  sparks:0.5, particleCount:15000, fill:0.55, motion:'orbit', particleShape:'square', depth:0.6, sway:0.7, twinkle:0.5, haze:0.8, dustSpeed:1 },
    eclipse: { color:'#FFFFFF', strands:4, crackle:0.5,  flares:0.4,  glow:0.7,  sparks:0.35, particleCount:14000, fill:0.5, motion:'drift', particleShape:'square', depth:0.7, sway:0.5, twinkle:0.5, haze:0.5, dustSpeed:0.8 },
    abyss:   { color:'#3F7BFF', strands:5, crackle:0.55, flares:0.6,  glow:0.9,  sparks:0.4, particleCount:20000, fill:0.8, motion:'orbit', particleShape:'round', depth:0.8, sway:0.8, twinkle:0.5, haze:0.6, dustSpeed:0.9 }
  };
  const MOTIONS = { rise:0, fall:1, drift:2, orbit:3 };
  const SHAPES = { square:0, round:1 };
  const MAX_STRANDS = 8, MAX_ARCS = 4, MAX_PARTICLES = 40000;
  const STATE_WIDTH = 256;
  const PIXEL_BUDGET = 4.5e6;
  const INTRO_SECONDS = 2.2, SETTLE_SECONDS = 7;
  const WHITE = [1,1,1], BLACK = [0,0,0];

  const clamp = (v,a,b)=>Math.min(Math.max(v,a),b);
  const smooth = (e0,e1,v)=>{ const t=clamp((v-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
  const easeOut = t=>1-Math.pow(1-t,3);
  const mixColor = (a,b,t)=>a.map((v,i)=>v+(b[i]-v)*t);
  const wrapAngle = a=>a-Math.PI*2*Math.floor((a+Math.PI)/(Math.PI*2));

  const parseColor = (value,fallback)=>{
    try{
      const c = document.createElement('canvas').getContext('2d');
      if(!c) return fallback;
      c.fillStyle='#000000'; c.fillStyle=value;
      const r = c.fillStyle;
      if(r.startsWith('#')){
        const n = parseInt(r.slice(1),16);
        return [((n>>16)&255)/255, ((n>>8)&255)/255, (n&255)/255];
      }
      const p = r.match(/[\d.]+/g);
      if(!p||p.length<3) return fallback;
      return [Number(p[0])/255, Number(p[1])/255, Number(p[2])/255];
    }catch(e){ return fallback; }
  };
  const toLinear = c=>c<=0.04045?c/12.92:Math.pow((c+0.055)/1.055,2.4);
  const toGamma = c=>c<=0.0031308?c*12.92:1.055*Math.pow(c,1/2.4)-0.055;
  const toOklab = rgb=>{
    const [r,g,b]=rgb.map(toLinear);
    const l=Math.cbrt(0.4122214708*r+0.5363325363*g+0.0514459929*b);
    const m=Math.cbrt(0.2119034982*r+0.6806995451*g+0.1073969566*b);
    const s=Math.cbrt(0.0883024619*r+0.2817188376*g+0.6299787005*b);
    return [0.2104542553*l+0.793617785*m-0.0040720468*s, 1.9779984951*l-2.428592205*m+0.4505937099*s, 0.0259040371*l+0.7827717662*m-0.808675766*s];
  };
  const fromOklab = ([L,a,b])=>{
    const l=Math.pow(L+0.3963377774*a+0.2158037573*b,3);
    const m=Math.pow(L-0.1055613458*a-0.0638541728*b,3);
    const s=Math.pow(L-0.0894841775*a-1.291485548*b,3);
    return [4.0767416621*l-3.3077115913*m+0.2309699292*s, -1.2684380046*l+2.6097574011*m-0.3413193965*s, -0.0041960863*l-0.7034186147*m+1.707614701*s].map(v=>clamp(toGamma(clamp(v,0,1)),0,1));
  };
  const blend=(a,b,t)=>fromOklab(mixColor(toOklab(a),toOklab(b),t));
  const shift=(rgb,hue,lightness,chroma)=>{
    const [L,a,b]=toOklab(rgb);
    const c=Math.hypot(a,b)*chroma;
    const h=Math.atan2(b,a)+(hue*Math.PI)/180;
    return fromOklab([clamp(L+lightness,0,1),c*Math.cos(h),c*Math.sin(h)]);
  };
  const withLightness=(rgb,hue,lightness,chroma)=>{
    const [,a,b]=toOklab(rgb);
    const c=Math.max(Math.hypot(a,b)*chroma,0.02);
    const h=Math.atan2(b,a)+(hue*Math.PI)/180;
    return fromOklab([clamp(lightness,0,1),c*Math.cos(h),c*Math.sin(h)]);
  };
  const buildPalette=(color,light)=>{
    if(light){
      const ink=withLightness(color,0,Math.min(toOklab(color)[0],0.62),1.15);
      return { rim:ink, rimHot:ink, rimMid:ink, rimDeep:withLightness(color,0,0.72,0.8),
        spark:withLightness(color,0,0.6,1.2), sparkGlow:withLightness(color,0,0.78,0.8),
        haze:withLightness(color,0,0.8,0.6), edge:withLightness(color,0,0.72,0.8),
        tones:[withLightness(color,0,0.56,1.1),withLightness(color,16,0.6,1.05),withLightness(color,-16,0.5,1.1),withLightness(color,0,0.66,0.9),withLightness(color,0,0.74,0.7)] };
    }
    return { rim:color, rimHot:mixColor(color,WHITE,0.72), rimMid:mixColor(color,BLACK,0.15), rimDeep:mixColor(color,BLACK,0.45),
      spark:mixColor(color,WHITE,0.45), sparkGlow:shift(color,0,-0.15,1), haze:mixColor(color,BLACK,0.6),
      edge:shift(color,0,-0.3,0.9),
      tones:[shift(color,0,-0.06,1),shift(color,16,-0.02,1),shift(color,-16,-0.12,1.05),shift(blend(color,WHITE,0.25),0,0.04,1),blend(color,WHITE,0.7)] };
  };
  const seeded=start=>{
    let state=start>>>0;
    return ()=>{
      state=(state+0x6d2b79f5)>>>0;
      let t=state;
      t=Math.imul(t^(t>>>15),t|1);
      t^=t+Math.imul(t^(t>>>7),t|61);
      return ((t^(t>>>14))>>>0)/4294967296;
    };
  };
  const buildStrands=()=>{
    const random=seeded(99);
    const bands=[[6,12,0.6,1.6],[18,34,1.5,3.5],[40,70,3,7],[80,130,6,12]];
    const data={harmonics:[],rates:[],phases:[],flareHarmonics:[],flareRates:[],flarePhases:[]};
    for(let s=0;s<MAX_STRANDS;s++){
      bands.forEach(([lo,hi,sl,fa])=>{
        data.harmonics.push(Math.round(lo+random()*(hi-lo)));
        data.rates.push((sl+random()*(fa-sl))*(random()<0.5?-1:1));
        data.phases.push(random()*Math.PI*2);

  };
  const createTexture = (gl, opts) => {
    const tex = gl.createTexture();

    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, opts.magFilter || gl.NEAREST);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

      const t = createTexture(gl, { width, height, type: opts.type || gl.UNSIGNED_BYTE, internalFormat: opts.internalFormat || gl.RGBA, format: opts.format || gl.RGBA, minFilter: opts.minFilter || gl.NEAREST, magFilter: opts.magFilter || gl.NEAREST });

    if (!t) return;

    t.textures.forEach(x => gl.deleteTexture(x.texture));
  };

  /* ---------- 引擎（挂载到 container） ---------- */
  const boot = (container, settings) => {
    let cleanup = () => {};
    let wake = () => {};
    try {
      const canvas = document.createElement('canvas');
      canvas.style.display = 'block';
      canvas.style.position = 'absolute';
      canvas.style.left = '50%';
      canvas.style.top = '50%';
      canvas.style.transform = 'translate(-50%,-50%)';
      canvas.style.width = '200%';
      canvas.style.height = '200%';
      canvas.style.pointerEvents = 'none';
      canvas.setAttribute('aria-hidden', 'true');
      container.appendChild(canvas);
      const gl = canvas.getContext('webgl2', { alpha: true, premultipliedAlpha: true, antialias: false, depth: false });
      if (!gl) { if (canvas.parentNode) canvas.parentNode.removeChild(canvas); return cleanup; }
      gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, false);

      const triangleVAO = gl.createVertexArray();
      gl.bindVertexArray(triangleVAO);
      const pb = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, pb);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(0);
      gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
      const ub = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, ub);
      gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([0,0, 2,0, 0,2]), gl.STATIC_DRAW);
      gl.enableVertexAttribArray(1);
      gl.vertexAttribPointer(1, 2, gl.FLOAT, false, 0, 0);
      gl.bindVertexArray(null);

      const blank = createTexture(gl, { width: 1, height: 1, image: new Uint8Array([0,0,0,0]) });
      const fullFloat = !!gl.getExtension('EXT_color_buffer_float');
      const halfFloat = fullFloat || !!gl.getExtension('EXT_color_buffer_half_float');
      const encode = halfFloat ? 1 : 0.25;
      const strandData = buildStrands();
      const arcData = new Array(MAX_ARCS * 4).fill(0);

      const fieldUniforms = {
        uCenter:{value:[0,0]}, uRadius:{value:1}, uDpr:{value:1}, uLine:{value:0.6}, uTime:{value:0},
        uFrame:{value:0}, uBins:{value:420}, uStrands:{value:5}, uCrackle:{value:0.6}, uFlares:{value:0.5},
        uGlow:{value:0.8}, uHaze:{value:0.7}, uFill:{value:0.5}, uPresence:{value:0}, uUnfold:{value:0},
        uBloom:{value:0}, uInside:{value:0}, uEncode:{value:encode},
        uRim:{value:[1,1,1]}, uRimHot:{value:[1,1,1]}, uRimMid:{value:[1,1,1]}, uRimDeep:{value:[1,1,1]},
        uSpark:{value:[1,1,1]}, uSparkGlow:{value:[1,1,1]}, uHazeColor:{value:[0,0,0]}, uEdgeColor:{value:[0,0,0]},
        uHeat:{value:[0,0,0,0]},
        uHarmonics:{value:strandData.harmonics}, uRates:{value:strandData.rates}, uPhases:{value:strandData.phases},
        uFlareHarmonics:{value:strandData.flareHarmonics}, uFlareRates:{value:strandData.flareRates}, uFlarePhases:{value:strandData.flarePhases},
        uArcs:{value:arcData}
      };
      const dustShared = {
        uDustTime:{value:0}, uTurn:{value:[0,0]}, uMotion:{value:0}, uFill:fieldUniforms.uFill,
        tHome:{value:blank}, tSeed:{value:blank}
      };
      const dustUniforms = {
        ...dustShared, tOffset:{value:blank}, uStirred:{value:0}, uCenter:fieldUniforms.uCenter,
        uViewport:{value:[1,1]}, uRadius:fieldUniforms.uRadius, uDpr:fieldUniforms.uDpr,
        uDepth:{value:0.6}, uTwinkle:{value:0.5}, uPointScale:{value:1}, uReveal:{value:0}, uEncode:{value:encode},
        uTones:{value:new Array(15).fill(1)}, uRimTone:{value:[1,1,1]}, uShape:{value:0}
      };
      const stirUniforms = {
        ...dustShared, tOffset:{value:blank}, tVelocity:{value:blank}, uDt:{value:0.016},
        uReset:{value:1}, uBrush:{value:[0,0,0,0]}, uBrushPower:{value:0}, uKick:{value:[0,0,0,0]}
      };

      let sceneTarget = createFBO(gl, 1, 1, { type: halfFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, format: gl.RGBA, internalFormat: halfFloat ? gl.RGBA16F : gl.RGBA });
      const compositeUniforms = { tScene:{value:sceneTarget.textures[0]}, uLight:{value:0}, uDecode:{value:1/encode} };

      const fieldProgram = createProgram(gl, passVertex, fieldFragment);
      const dustProgram = createProgram(gl, dustVertex, dustFragment);
      const compositeProgram = createProgram(gl, passVertex, compositeFragment);
      const stirProgram = halfFloat ? createProgram(gl, passVertex, stirFragment) : null;
      const draw = (mesh, target, clear) => {
        gl.useProgram(mesh.program.p);
        if (target) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, target.buffer);
          gl.viewport(0, 0, target.width, target.height);
          if (target.colorCount > 1) gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1]);
        } else {
          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
        }
        if (mesh.blend) { gl.enable(gl.BLEND); gl.blendFunc(mesh.blend[0], mesh.blend[1]); }
        else gl.disable(gl.BLEND);
        gl.bindVertexArray(mesh.vao || triangleVAO);
        applyUniforms(gl, mesh.program, mesh.uniforms);
        if (clear) { gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT); }
        gl.drawArrays(mesh.mode, 0, mesh.count || 3);
        gl.bindVertexArray(null);
      };
      const stateTarget = rows => createFBO(gl, STATE_WIDTH, rows, { color: 2, type: fullFloat ? gl.FLOAT : gl.HALF_FLOAT, format: gl.RGBA, internalFormat: fullFloat ? gl.RGBA32F : gl.RGBA16F });
      const dataTexture = (data, rows) => createTexture(gl, { image: data, width: STATE_WIDTH, height: rows, type: gl.FLOAT, format: gl.RGBA, internalFormat: gl.RGBA32F });

      let dust = null;
      const resetStir = () => {
        if (!stirProgram || !dust || !dust.read || !dust.write) return;
        stirUniforms.tOffset.value = blank;
        stirUniforms.tVelocity.value = blank;
        stirUniforms.uReset.value = 1;
        draw({ program: stirProgram, blend: null, mode: gl.TRIANGLES, uniforms: stirUniforms }, dust.read, false);
        draw({ program: stirProgram, blend: null, mode: gl.TRIANGLES, uniforms: stirUniforms }, dust.write, false);
        stirUniforms.uReset.value = 0;
      };
      const rebuildDust = requested => {
        const total = clamp(Math.round(requested / 100) * 100, 0, MAX_PARTICLES);
        if (dust && dust.requested === total) return;
        if (dust) { if (dust.buf) gl.deleteBuffer(dust.buf); dust = null; }
        if (!total) return;
        const data = buildDust(total);
        const indices = new Float32Array(data.count);
        for (let i = 0; i < data.count; i++) indices[i] = i;
        const vao = gl.createVertexArray();
        gl.bindVertexArray(vao);
        const buf = gl.createBuffer();
        gl.bindBuffer(gl.ARRAY_BUFFER, buf);
        gl.bufferData(gl.ARRAY_BUFFER, indices, gl.STATIC_DRAW);
        gl.enableVertexAttribArray(2);
        gl.vertexAttribPointer(2, 1, gl.FLOAT, false, 0, 0);
        gl.bindVertexArray(null);
        const home = dataTexture(data.home, data.rows);
        const seed = dataTexture(data.seed, data.rows);

          requested: total, count: data.count, rows: data.rows, home, seed, buf, vao,
          uniforms: dustUniforms,
          read: stirProgram ? stateTarget(data.rows) : null,
          write: stirProgram ? stateTarget(data.rows) : null
        };

        dustShared.tSeed.value = seed;
        resetStir();
        stirring = 0;
      };

      /* settings 由宿主组件（CrystalBallHero）持有并实时读写 */
      const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      const random = seeded(913);
      let width = 1, height = 1, logicalW = 1, logicalH = 1, raf = 0, last = performance.now();
      let rimTime = 0, dustTime = 0, swayClock = 0, introClock = 0, visible = true, alive = true;
      let surge = 0, stirring = 0, stirEnergy = 0, kick = null, nextArc = 0.3;
      const arcs = [];
      const pointer = { x: 0, y: 0, inside: false, fresh: true };
      const heat = { angle: 0, velocity: 0, power: 0, near: 0 };
      const brush = { x: 0, y: 0, vx: 0, vy: 0 };
      const look = { x: 0, y: 0, vx: 0, vy: 0 };
      let palette = null, paletteKey = '';

      const resizeScene = () => {
        logicalW = Math.max(1, container.clientWidth);
        logicalH = Math.max(1, container.clientHeight);
        width = logicalW * 2;
        height = logicalH * 2;
        const dpr = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(PIXEL_BUDGET / (width * height)));

        canvas.height = Math.round(height * dpr);

        sceneTarget = createFBO(gl, canvas.width, canvas.height, { type: halfFloat ? gl.HALF_FLOAT : gl.UNSIGNED_BYTE, format: gl.RGBA, internalFormat: halfFloat ? gl.RGBA16F : gl.RGBA });

        start();
      };

      const spawnArc = (angle, strength) => {
        if (arcs.length >= MAX_ARCS) return;
        arcs.push({ start: angle, span: (0.05 + random() * 0.07) * (random() < 0.5 ? -1 : 1), curl: 0.02 + random() * 0.04, life: 0, duration: 0.2 + random() * 0.2, drift: (random() - 0.5) * 0.3, strength });
      };

      const frame = now => {
        raf = 0;
        if (!alive) return;
        const s = settings;
        const dt = Math.min(0.05, Math.max(1 / 240, (now - last) / 1000));
        last = now;
        const moving = !s.paused && !reducedMotion;
        introClock = s.intro && !reducedMotion ? Math.min(1, introClock + dt / INTRO_SECONDS) : 1;
        const presence = easeOut(smooth(0, 0.42, introClock));
        const unfold = easeOut(smooth(0, 0.32, introClock));
        const charge = Math.sin(Math.PI * smooth(0.22, 0.78, introClock)) * 0.12;
        const radius = Math.max(8, (clamp(s.size, 0.1, 1.5) * Math.min(logicalW, logicalH)) / 2);

        const strength = s.interactive && !reducedMotion ? clamp(s.hoverStrength, 0, 1) : 0;
        const px = pointer.x - logicalW / 2;
        const py = logicalH / 2 - pointer.y;
        const reach = Math.hypot(px, py);
        const target = pointer.inside ? strength : 0;
        if (heat.power < 0.02) { heat.angle = Math.atan2(py, px); heat.velocity = 0; }
        const turn = wrapAngle(Math.atan2(py, px) - heat.angle);
        heat.velocity += (120 * turn - 19 * heat.velocity) * dt;
        heat.angle = wrapAngle(heat.angle + heat.velocity * dt);
        heat.power += (target - heat.power) * (1 - Math.exp(-dt / (target > heat.power ? 0.3 : 0.55)));
        const nearTarget = Math.exp(-Math.pow((reach - radius) / (radius * 0.45), 2));
        heat.near += (nearTarget - heat.near) * (1 - Math.exp(-dt / 0.15));
        surge *= Math.exp(-dt / 0.7);

        if (pointer.fresh) { brush.x = bx; brush.y = by; brush.vx = 0; brush.vy = 0; pointer.fresh = false; }
        const follow = 1 - Math.exp(-dt / 0.05);

        brush.vy += ((by - brush.y) / dt - brush.vy) * follow;
        brush.x = bx; brush.y = by;
        const brushSpeed = Math.hypot(brush.vx, brush.vy);
        const cap = brushSpeed > 4 ? 4 / brushSpeed : 1;
        const inBall = Math.exp(-Math.max(0, Math.hypot(bx, by) - 1) * 6);
        const brushPower = pointer.inside ? strength * inBall * presence : 0;
        stirEnergy = stirEnergy * Math.exp(-dt / 1.2) + brushPower * Math.min(brushSpeed, 4) * dt;

          const pace = 1 + surge * 0.6 + heat.power * heat.near * 0.3;
          const step = dt * Math.max(0, s.speed) * 2 * pace;
          rimTime += step;
          dustTime += dt * Math.max(0, s.dustSpeed) * (1 + surge * 0.4);
          swayClock += dt * Math.max(0, s.dustSpeed);
          const crackleNow = clamp(s.crackle + surge * 0.5, 0, 1.5);
          if (s.sparks > 0.01 && introClock > 0.55) {
            nextArc -= step * s.sparks * 2 * (0.6 + crackleNow * 0.6);
            if (nextArc <= 0) {
              const local = heat.power * heat.near;
              const angle = random() < local * 0.7 ? heat.angle + (random() - 0.5) * 0.8 : random() < 0.7 ? Math.PI / 2 + (random() - 0.5) * 1.5 : random() * Math.PI * 2;
              spawnArc(angle, 0.8 + local * 0.6 + surge * 0.4);
              nextArc = 0.15 + random() * 0.6;
            }
          }
          for (let i = arcs.length - 1; i >= 0; i--) {
            const arc = arcs[i];
            arc.life += step;
            arc.start += arc.drift * step;
            if (arc.life >= arc.duration) arcs.splice(i, 1);
          }
        } else arcs.length = 0;
        for (let i = 0; i < MAX_ARCS; i++) {
          const arc = arcs[i];
          arcData[i * 4] = arc ? arc.start : 0;
          arcData[i * 4 + 1] = arc ? arc.span : 0;
          arcData[i * 4 + 2] = arc ? arc.curl : 0;
          arcData[i * 4 + 3] = arc ? Math.sin((Math.PI * arc.life) / arc.duration) * arc.strength : 0;
        }

        rebuildDust(s.particleCount);
        const light = s.theme === 'light';
        if (!palette || light !== s.light || s.color !== paletteKey) { s.light = light; paletteKey = s.color; palette = buildPalette(parseColor(s.color, [0.95,0.36,0.82]), light); }

        fieldUniforms.uCenter.value = [width / 2, height / 2];
        fieldUniforms.uRadius.value = radius;
        fieldUniforms.uDpr.value = Math.min(window.devicePixelRatio || 1, 2, Math.sqrt(PIXEL_BUDGET / (width * height)));
        fieldUniforms.uLine.value = Math.max(0.6, radius * 0.0035);
        fieldUniforms.uTime.value = rimTime;
        fieldUniforms.uFrame.value = Math.floor(rimTime * 24) % 100000;
        fieldUniforms.uBins.value = clamp(Math.round((Math.PI * 2 * radius) / 2.6), 240, 900);
        fieldUniforms.uStrands.value = Math.round(clamp(s.strands, 1, MAX_STRANDS));
        fieldUniforms.uCrackle.value = clamp(s.crackle, 0, 1) + surge * 0.5 + charge;
        fieldUniforms.uFlares.value = clamp(s.flares, 0, 1);
        fieldUniforms.uGlow.value = clamp(s.glow, 0, 2) * (1 + surge * 0.5 + charge) * (light ? 0.35 : 1);
        fieldUniforms.uHaze.value = clamp(s.haze, 0, 2) * (light ? 0.6 : 1);
        fieldUniforms.uFill.value = clamp(s.fill, 0, 1);
        fieldUniforms.uPresence.value = presence;
        fieldUniforms.uUnfold.value = unfold;
        fieldUniforms.uBloom.value = presence * presence;
        fieldUniforms.uInside.value = smooth(0.2, 0.95, introClock);
        fieldUniforms.uRim.value = palette.rim;
        fieldUniforms.uRimHot.value = palette.rimHot;
        fieldUniforms.uRimMid.value = palette.rimMid;
        fieldUniforms.uRimDeep.value = palette.rimDeep;
        fieldUniforms.uSpark.value = palette.spark;
        fieldUniforms.uSparkGlow.value = palette.sparkGlow;
        fieldUniforms.uHazeColor.value = palette.haze;
        fieldUniforms.uEdgeColor.value = palette.edge;
        fieldUniforms.uHeat.value = [heat.angle, heat.near, heat.power * presence, 0];

        dustShared.uDustTime.value = dustTime;
        const gaze = pointer.inside ? strength * presence : 0;
        const lookX = clamp(bx, -1.6, 1.6) * gaze;
        const lookY = clamp(by, -1.6, 1.6) * gaze;
        look.vx += (40 * (lookX - look.x) - 11 * look.vx) * dt;
        look.vy += (40 * (lookY - look.y) - 11 * look.vy) * dt;
        look.x += look.vx * dt;
        look.y += look.vy * dt;
        const swing = clamp(s.sway, 0, 1);
        dustShared.uTurn.value = [swing * 0.42 * Math.sin(swayClock * 0.23) + look.x * 0.3, swing * 0.12 * Math.sin(swayClock * 0.17 + 1.3) - look.y * 0.16];
        dustShared.uMotion.value = MOTIONS[s.motion] ?? 0;
        dustUniforms.uViewport.value = [width, height];
        dustUniforms.uDepth.value = clamp(s.depth, 0, 1);
        dustUniforms.uTwinkle.value = clamp(s.twinkle, 0, 1);
        dustUniforms.uPointScale.value = Math.max(1, radius / 491);
        dustUniforms.uReveal.value = smooth(0.18, 1, introClock);
        dustUniforms.uTones.value = palette.tones.flat();
        dustUniforms.uRimTone.value = palette.rim;
        dustUniforms.uShape.value = SHAPES[s.particleShape] ?? 0;

        const layer = dust;
        if (layer && stirProgram && (stirEnergy > 0.002 || kick)) stirring = SETTLE_SECONDS;
        let stirred = false;
        if (layer && layer.read && layer.write && stirProgram && stirring > 0) {
          stirUniforms.uDt.value = Math.min(dt, 1 / 30);
          stirUniforms.uBrush.value = [brush.x, brush.y, brush.vx * cap, brush.vy * cap];
          stirUniforms.uBrushPower.value = brushPower;
          stirUniforms.uKick.value = kick ? [kick.x, kick.y, kick.strength, 0] : [0, 0, 0, 0];
          stirUniforms.tOffset.value = layer.read.textures[0];
          stirUniforms.tVelocity.value = layer.read.textures[1];
          draw({ program: stirProgram, blend: null, mode: gl.TRIANGLES, uniforms: stirUniforms }, layer.write, false);
          const swap = layer.read; layer.read = layer.write; layer.write = swap;
          stirring -= dt;
          stirred = stirring > 0;
          if (!stirred) { stirring = 0; resetStir(); }
        }
        kick = null;
        dustUniforms.uStirred.value = stirred ? 1 : 0;
        dustUniforms.tOffset.value = layer && layer.read ? layer.read.textures[0] : blank;

        draw({ program: fieldProgram, blend: [gl.ONE, gl.ONE], mode: gl.TRIANGLES, uniforms: fieldUniforms }, sceneTarget, true);
        if (dust) draw({ program: dustProgram, blend: [gl.ONE, gl.ONE], mode: gl.POINTS, uniforms: dustUniforms, count: dust.count }, sceneTarget, false);
        compositeUniforms.uLight.value = light ? 1 : 0;
        draw({ program: compositeProgram, blend: [gl.ONE, gl.ONE_MINUS_SRC_ALPHA], mode: gl.TRIANGLES, uniforms: compositeUniforms }, null, false);

        const settling = Math.abs(target - heat.power) > 0.002 || surge > 0.002 || stirring > 0 || Math.abs(heat.velocity) > 0.01 || Math.hypot(look.vx, look.vy, look.x - lookX, look.y - lookY) > 0.001;
        if (visible && (moving || introClock < 1 || settling)) raf = requestAnimationFrame(frame);
      };
      const start = () => { if (raf || !visible || !alive) return; last = performance.now(); raf = requestAnimationFrame(frame); };

      const locate = e => { const r = container.getBoundingClientRect(); const x = e.clientX - r.left, y = e.clientY - r.top; return { x, y, inside: x >= 0 && y >= 0 && x <= r.width && y <= r.height }; };
      const onPointerMove = e => {
        const spot = locate(e);
        if (spot.inside && !pointer.inside) pointer.fresh = true;
        pointer.x = spot.x; pointer.y = spot.y; pointer.inside = spot.inside;
        if (spot.inside) start();
      };
      const onPointerDown = e => {
        const spot = locate(e);
        if (!settings.interactive || reducedMotion || !spot.inside) return;
        if (!pointer.inside) pointer.fresh = true;
        pointer.x = spot.x; pointer.y = spot.y; pointer.inside = true;
        const radius = Math.max(8, (clamp(settings.size, 0.1, 1.5) * Math.min(logicalW, logicalH)) / 2);
        const kx = (spot.x - logicalW / 2) / radius, ky = (logicalH / 2 - spot.y) / radius;
        const distance = Math.hypot(kx, ky);
        if (distance > 1.3) return;
        const strength = clamp(settings.hoverStrength, 0, 1);
        kick = { x: kx, y: ky, strength: strength * 1.2 };
        surge = Math.max(surge, strength);
        const angle = Math.atan2(ky, kx);
        spawnArc(angle + (random() - 0.5) * 0.5, 1.3);
        spawnArc(angle + Math.PI + (random() - 0.5) * 1.2, 1.1);
        start();
      };
      const onPointerLeave = () => { pointer.inside = false; start(); };
      const onPointerOut = e => { if (!e.relatedTarget) onPointerLeave(); };
      const onPointerUp = e => { if (e.pointerType === 'touch') onPointerLeave(); };
      const onVisibility = () => { if (!document.hidden) start(); };

      window.addEventListener('pointermove', onPointerMove, { passive: true });
      window.addEventListener('pointerdown', onPointerDown, { passive: true });
      window.addEventListener('pointerout', onPointerOut, { passive: true });
      window.addEventListener('pointerup', onPointerUp, { passive: true });
      window.addEventListener('blur', onPointerLeave);
      document.addEventListener('visibilitychange', onVisibility);

      const ro = new ResizeObserver(resizeScene);
      ro.observe(container);
      const io = new IntersectionObserver(([entry]) => { visible = entry.isIntersecting; start(); });
      io.observe(container);

      resizeScene();

/* CipherReveal — 进入视口后字母乱码，从左到右逐个锁定为最终文字；乱码仅限 A-Z/a-z */
const CipherReveal = ({ text, className = '', replayToken = 0 }) => {
  const ref = useRef(null);
  const startRef = useRef(null);
  const chars = Array.from(text);
  const targets = chars.filter((c) => c !== ' ');
  // 初始即渲染最终文字并全亮，保证任何情况下文字都可见，不会消失
  const [display, setDisplay] = useState(() => chars.slice());

  useEffect(() => {
    let timer = null;
    let locked = targets.map(() => false);
    const lockTimes = targets.map((_, i) => ((i + 1) / targets.length) * 1400);
    const randLetter = () => 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz'[Math.floor(Math.random() * 52)];

    const startDecode = () => {
      locked = targets.map(() => false);
      setDisplay(chars.map((c) => (c === ' ' ? ' ' : randLetter())));
      const start = performance.now();
      clearInterval(timer);
      timer = setInterval(() => {
        const elapsed = (performance.now() - start) / 1000;
        let allLocked = true;
        targets.forEach((_, ti) => { if (elapsed < lockTimes[ti] / 1000) allLocked = false; });
        setDisplay((prev) => {
          const next = prev.slice();
          let ti = 0;
          chars.forEach((ch, i) => {
            if (ch === ' ') return;
            if (locked[ti]) { ti++; return; }
            if (elapsed >= lockTimes[ti] / 1000) {
              locked[ti] = true;
              next[i] = targets[ti];
            } else {
              next[i] = randLetter();
            }
            ti++;
          });
          return next;
        });
        if (allLocked) clearInterval(timer);
      }, 1000 / 14);
    };

    startRef.current = startDecode;

    const io = new IntersectionObserver((entries) => {
      entries.forEach((en) => {
        if (en.isIntersecting) { startDecode(); io.disconnect(); }
      });
    }, { threshold: 0.3 });
    io.observe(ref.current);

    return () => { io.disconnect(); clearInterval(timer); };
  }, [text]);

  // replayToken 变化时重播一次解码动画
  useEffect(() => {
    if (replayToken > 0 && startRef.current) startRef.current();
  }, [replayToken]);

  return (
    <p ref={ref} className={className} style={{ color: '#D7E2EA' }}>
      {display.map((ch, i) => (ch === ' ' ? '\u00A0' : ch))}
    </p>
  );
};

/* GradientText — 从第一个字到最后一个字逐字渐变（品牌灰 #646973 → 浅蓝 #BBCCD7） */
const GradientText = ({ text, className = '' }) => {
  const chars = Array.from(text);
  const from = [0xBB, 0xCC, 0xD7];
  const to = [0x64, 0x69, 0x73];
  return (
    <p className={className}>
      {chars.map((ch, i) => {
        const t = chars.length > 1 ? i / (chars.length - 1) : 0;
        const r = Math.round(from[0] + (to[0] - from[0]) * t);
        const g = Math.round(from[1] + (to[1] - from[1]) * t);
        const b = Math.round(from[2] + (to[2] - from[2]) * t);
        return <span key={i} style={{ color: `rgb(${r}, ${g}, ${b})` }}>{ch}</span>;
      })}
    </p>
  );
};

/* ============================================================
   GalleryCoverflow — 详情页弧形卡片：拖拽/滚轮/方向键切换，悬停轻抬，点击放大
   ============================================================ */
function GalleryCoverflow({ images, name, size = 'portrait', noZoom = false, noWheel = false }) {
  const stageRef = useRef(null);
  const cardRefs = useRef([]);
  const [openIdx, setOpenIdx] = useState(-1);
  const st = useRef({ current: 0, target: 0, dragging: false, sx: 0, start: 0, moved: false, raf: 0, downCard: null });

  const N = (images && images.length) || 0;

  useEffect(() => {
    if (!N) return;
    const s = st.current;
    const stage = stageRef.current;
    const gap = size === 'wide' ? 547 : 300;
    const norm = (rel) => {
      rel = rel % N;
      if (rel > N / 2) rel -= N;
      if (rel < -N / 2) rel += N;
      return rel;
    };
    const layout = () => {
      for (let i = 0; i < N; i++) {
        const rel = norm(i - s.current);
        const abs = Math.abs(rel);
        // 与最新 circular-gallery-preview 一致：间距 300、下沉 30、外倾 9°、邻卡 0.94
        const x = rel * gap, y = abs * 30, rot = rel * 9;
        const scale = Math.max(0.7, 1 - abs * 0.06);
        let op;
        if (abs > 2.3) op = 0;
        else if (abs > 1.6) op = 0.25;
        else if (abs > 0.5) op = 0.95;
        else op = 1;
        const el = cardRefs.current[i];
        if (!el) continue;
        el.style.transform = `translate3d(${x}px, ${y}px, 0) rotate(${rot}deg) scale(${scale})`;
        el.style.opacity = op.toFixed(3);
        el.style.zIndex = Math.round(100 - abs);
      }
    };
    /* 缓慢从右往左自动旋转：每帧推进 0.003 张（约 5 秒一张），悬停/拖拽暂停，尊重系统减弱动效 */
    const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    const driftStep = reduceMotion ? 0 : 0.0015;
    let driftPaused = false;
    const tick = () => {
      if (!s.dragging && !driftPaused) s.target += driftStep;
      s.current += (s.target - s.current) * 0.05;
      if (Math.abs(s.target - s.current) < 0.001) s.current = s.target;
      layout();
      s.raf = requestAnimationFrame(tick);
    };
    s.raf = requestAnimationFrame(tick);
    /* 悬停暂停缩小到卡片本身：指针落在任意一张卡片上才暂停旋转 */
    const onEnter = () => { driftPaused = true; };
    const onLeave = () => { driftPaused = false; };
    cardRefs.current.slice(0, N).forEach((el) => {
      if (el) { el.addEventListener('pointerenter', onEnter); el.addEventListener('pointerleave', onLeave); }
    });

    const onDown = (e) => {
      s.dragging = true; s.moved = false; s.sx = e.clientX; s.start = s.target;
      s.downCard = e.target && e.target.closest ? e.target.closest('.cf-card') : null;
      stage.dataset.dragging = '1';
      stage.setPointerCapture(e.pointerId);
    };
    const onMove = (e) => {
      if (!s.dragging) return;
      const dx = e.clientX - s.sx;
      if (Math.abs(dx) > 8) s.moved = true;
      s.target = s.start - dx / 180;
    };
    const onUp = () => {
      if (!s.dragging) return;
      s.dragging = false;
      delete stage.dataset.dragging;
      s.target = Math.round(s.target);
      // 单击（无拖拽）卡片 -> 展开大图。pointer capture 会把 click 事件重定向到 stage，
      // 因此在这里用 pointerup 判定，保证点击一定能展开。
      if (!s.moved && s.downCard) {
        const idx = cardRefs.current.indexOf(s.downCard);
        if (idx >= 0) setOpenIdx(idx);
      }
      s.downCard = null;
    };
    const onWheel = (e) => {
      e.preventDefault();
      s.target = Math.round(s.target) + (e.deltaY > 0 ? 1 : -1);
    };
    const onKey = (e) => {
      if (e.key === 'Escape') { setOpenIdx(-1); return; }
      if (['ArrowRight', 'ArrowDown'].includes(e.key)) s.target = Math.round(s.target) + 1;
      if (['ArrowLeft', 'ArrowUp'].includes(e.key)) s.target = Math.round(s.target) - 1;
    };
    stage.addEventListener('pointerdown', onDown);
    stage.addEventListener('pointermove', onMove);
    stage.addEventListener('pointerup', onUp);
    stage.addEventListener('pointercancel', onUp);
    stage.addEventListener('pointerleave', onUp);
    if (!noWheel) stage.addEventListener('wheel', onWheel, { passive: false });
    window.addEventListener('keydown', onKey);
    return () => {
      cancelAnimationFrame(s.raf);
      stage.removeEventListener('pointerdown', onDown);
      stage.removeEventListener('pointermove', onMove);
      stage.removeEventListener('pointerup', onUp);
      stage.removeEventListener('pointercancel', onUp);
      stage.removeEventListener('pointerleave', onUp);
      cardRefs.current.slice(0, N).forEach((el) => {
        if (el) { el.removeEventListener('pointerenter', onEnter); el.removeEventListener('pointerleave', onLeave); }
      });
      if (!noWheel) stage.removeEventListener('wheel', onWheel);
      window.removeEventListener('keydown', onKey);
    };
  }, [N, size, noWheel]);

  if (!N) return null;

  return (
    <div className="w-full relative">
      <div className={`cf-stage${size === 'wide' ? ' cf-stage--wide' : ''}`} ref={stageRef}>
        {images.map((src, i) => (
          <div
            key={i}
            className={`cf-card${size === 'wide' ? ' cf-card--wide' : ''}`}
            ref={(el) => (cardRefs.current[i] = el)}
            onClick={() => { if (!noZoom && !st.current.moved) setOpenIdx(i); }}
          >
            <div className="cf-pic">
              <img src={src} alt={`${name} — ${i + 1}`} loading="lazy" draggable="false" />
              <div className="cf-shine" />
            </div>
          </div>
        ))}
      </div>

      {/* 单击卡片后：大图悬浮在轮播图前方并遮挡（Esc 或点击暗色区域关闭，无 × 按钮）；noZoom 时不启用 */}
      {!noZoom && openIdx >= 0 && (
        <div className="cf-float" onClick={(e) => { if (e.target === e.currentTarget) setOpenIdx(-1); }}>
          <img src={images[openIdx]} alt={`${name} — enlarged ${openIdx + 1}`} />
        </div>
      )}
    </div>
  );
}

/* ============================================================
   GalleryModal — 项目详情弹窗（参考 gallery 预览样式）：
   居中圆角窗口 + 弹窗内纵向流畅滚动画廊 + 右侧滑动指示栏 + 右上关闭
   ============================================================ */
const GalleryModal = ({ project }) => {
  const images = project.gallery || [];
  const n = images.length;
  const bodyRef = useRef(null);
  const [prog, setProg] = useState({ top: 0, viewH: 0, scrollH: 0 });
  useEffect(() => {
    const el = bodyRef.current;
    if (!el) return;
    const update = () => setProg({ top: el.scrollTop, viewH: el.clientHeight, scrollH: el.scrollHeight });
    update();
    el.addEventListener('scroll', update, { passive: true });
    window.addEventListener('resize', update);
    return () => { el.removeEventListener('scroll', update); window.removeEventListener('resize', update); };
  }, []);
  useEffect(() => {
    const onKey = (e) => { if (e.key === 'Escape') { window.location.hash = ''; } };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);
  const { top, viewH, scrollH } = prog;
  const barPad = 48; // 指示栏避开上下留白（与容器 h-[calc(100%-48px)] 一致）
  const barH = viewH - barPad;
  const ratio = viewH > 0 && scrollH > viewH ? viewH / scrollH : 0;
  const thumbH = ratio > 0 ? Math.max(26, ratio * barH) : 0;
  const thumbTop = ratio > 0 && scrollH > viewH ? (top / (scrollH - viewH)) * (barH - thumbH) : 0;
  return (
    <main className="min-h-screen bg-[#0C0C0C] text-[#D7E2EA] overflow-x-clip flex items-center justify-center px-4 sm:px-6 py-8 sm:py-12">
      <div className="gm-window relative w-full max-w-[1120px] h-[86vh] rounded-[26px] sm:rounded-[34px] border border-white/10 bg-[#141417] shadow-[0_40px_120px_rgba(0,0,0,.75)] overflow-hidden">
        {/* 关闭按钮 — 窗口右上角 */}

          type="button"
          aria-label="close gallery"
          onClick={() => { window.location.hash = ''; }}
          className="absolute top-4 right-4 z-50 w-11 h-11 rounded-full grid place-items-center text-[#D7E2EA] opacity-80 hover:opacity-100 hover:bg-white/10 transition-colors duration-200"
        >
          <svg width="20" height="20" viewBox="0 0 18 18" fill="none" aria-hidden="true">
            <path d="M4 4l10 10M14 4L4 14" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" />
          </svg>
        </button>

        {/* 右侧滑动指示栏 */}
        {ratio > 0 && (
          <div className="absolute right-3 sm:right-4 top-1/2 -translate-y-1/2 z-20 w-[3px] h-[calc(100%-48px)] rounded-full bg-white/10 pointer-events-none">
            <div
              className="absolute left-0 w-full rounded-full bg-[#9478FF]/80"
              style={{ top: thumbTop, height: thumbH }}
            />
          </div>
        )}

        {/* 滚动内容 — 流畅跟手滚动（无吸附） */}
        <div ref={bodyRef} className="gm-scroll h-full overflow-y-auto overflow-x-hidden pr-4 sm:pr-6">
          <div>
            {/* 信息区 — 左对齐（位置保持原样） */}
            <div className="px-6 sm:px-10 md:px-12 pt-8 sm:pt-10 md:pt-12 pb-6 sm:pb-8 pr-16 sm:pr-20">
              <span className="text-[#9478FF]/90 font-light uppercase tracking-[0.25em] text-xs sm:text-sm">{project.category}</span>
              <h2 className="hero-heading font-black uppercase leading-none tracking-tight mt-2 sm:mt-3 text-[clamp(1.8rem,4.5vw,3.6rem)]">{project.name}</h2>
              {project.desc && (
                <p className="text-[#D7E2EA]/65 font-light leading-relaxed max-w-2xl mt-3 sm:mt-4 text-[clamp(0.85rem,1.4vw,1.05rem)]">{project.desc}</p>
              )}
            </div>

            {/* 图片列表 — 居中，最大宽度与文字左侧对齐（同左内边距） */}
            <div className="flex flex-col items-center gap-5 sm:gap-7 px-6 sm:px-10 md:px-12 pb-12">
              {n > 0 ? (
                images.map((src, i) => (
                  <img key={i} src={src} alt={`${project.name} — page ${i + 1}`} loading="lazy" draggable="false"
                    className="w-full h-auto rounded-2xl shrink-0" />

/* 字体选项与动态加载（沿用 jsDelivr fontsource 字体镜像） */
function fontOptions() {
  return [
    { label: 'Kanit（默认）', family: 'Kanit', subset: 'latin' },
    { label: 'Space Grotesk', family: 'Space Grotesk', subset: 'latin' },
    { label: 'Montserrat', family: 'Montserrat', subset: 'latin' },
    { label: 'Poppins', family: 'Poppins', subset: 'latin' },
    { label: 'Inter', family: 'Inter', subset: 'latin' },
    { label: '思源黑体 Noto Sans SC', family: 'Noto Sans SC', subset: 'chinese-simplified' },
  ];
}
function applyFont(family) {
  const opt = fontOptions().find((o) => o.family === family) || fontOptions()[0];
  const base = `https://cdn.jsdelivr.net/fontsource/fonts/${opt.family.toLowerCase().replace(/ /g, '-')}@latest/`;
  let st = document.getElementById('dynamic-font-face');
  if (!st) {
    st = document.createElement('style');
    st.id = 'dynamic-font-face';
    document.head.appendChild(st);
  }
  st.textContent = [400, 600, 700]
    .map((w) => `@font-face{font-family:'${opt.family}';font-style:normal;font-weight:${w};font-display:swap;src:url(${base}${opt.subset}-${w}-normal.woff2) format('woff2');}`)
    .join('');
  document.documentElement.style.setProperty('--site-font', `'${opt.family}', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif`);
  SITE.fontFamily = family;
}

/* 本地上传图片：过大时压缩为 dataURL（长边 1600、JPEG 0.85），保证可随配置保存 */
function compressImage(dataUrl, maxEdge, quality, cb) {
  const img = new Image();
  img.onload = () => {
    let w = img.naturalWidth || img.width;
    let h = img.naturalHeight || img.height;
    const scale = Math.min(1, maxEdge / Math.max(w, h));
    w = Math.max(1, Math.round(w * scale));
    h = Math.max(1, Math.round(h * scale));
    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    c.getContext('2d').drawImage(img, 0, 0, w, h);
    cb(c.toDataURL('image/jpeg', quality));
  };
  img.onerror = () => showToast('图片读取失败');
  img.src = dataUrl;
}

/* 动态压缩：从高画质档逐级降低，直到压缩结果约 300KB（dataURL 约 410K 字符），兼顾清晰度与存储 */
function compressToTarget(dataUrl, cb) {
  const img = new Image();
  img.onload = () => {
    const nw = img.naturalWidth || img.width;
    const nh = img.naturalHeight || img.height;
    const TARGET = 410000; // ≈ 300KB 图片文件
    const stages = [
      { maxEdge: 1920, q: 0.85 },
      { maxEdge: 1600, q: 0.8 },
      { maxEdge: 1440, q: 0.75 },
      { maxEdge: 1280, q: 0.7 },
      { maxEdge: 1120, q: 0.65 },
      { maxEdge: 960, q: 0.6 },
      { maxEdge: 800, q: 0.55 }
    ];
    let s = 0;
    const tryStage = () => {
      if (s >= stages.length) { cb(dataUrl); return; }
      const st = stages[s];
      const scale = Math.min(1, st.maxEdge / Math.max(nw, nh));
      const w = Math.max(1, Math.round(nw * scale));
      const h = Math.max(1, Math.round(nh * scale));
      const c = document.createElement('canvas');
      c.width = w; c.height = h;
      c.getContext('2d').drawImage(img, 0, 0, w, h);
      const out = c.toDataURL('image/jpeg', st.q);
      if (out.length <= TARGET || s === stages.length - 1) { cb(out); return; }
      s += 1;
      tryStage();
    };
    tryStage();
  };
  img.onerror = () => showToast('图片读取失败');
  img.src = dataUrl;
}

  const onMarqueeFile = (e) => {
    const files = Array.prototype.slice.call((e.target.files) || []);

    if (!files.length) return;
    let added = 0;
    let done = 0;
    const results = [];
    const total = files.filter((f) => /^image\//.test(f.type)).length;
    if (!total) { showToast('请选择图片文件'); return; }
    const tryDone = () => {
      done += 1;
      if (done >= total) {
        results.forEach((r) => { if (r) SITE.marquee.push(r); });
        refresh();
        showToast('已按选择顺序追加 ' + added + ' 张图片');
      }
    };
    files.forEach((file, idx) => {
      if (!/^image\//.test(file.type)) { showToast('已跳过非图片文件'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        const url = reader.result;
        const put = (out) => { results[idx] = out; added += 1; tryDone(); };
        if (url.length > 420000) compressToTarget(url, put);
        else put(url);
      };
      reader.readAsDataURL(file);
    });
  };
  const onResumeFile = (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (file.type !== 'application/pdf' && !/\.pdf$/i.test(file.name)) { showToast('请选择 PDF 文件'); return; }

  const compressAllForSave = (cb) => {
    const targets = [];

    let idx = 0;
    const next = () => {
      while (idx < targets.length) {

        const sz = v.length;
        if (sz <= 420000) continue; // 已约 300KB 以内，跳过

          <input className={inputCls} value={SITE.contactPhone || ''} onChange={(e) => { SITE.contactPhone = e.target.value; refresh(); }} />
          <label className="block text-white/70 text-xs mb-1 mt-2">联系邮箱</label>
          <input className={inputCls} value={SITE.contactEmail || ''} onChange={(e) => { SITE.contactEmail = e.target.value; refresh(); }} />
          <div className="flex items-center gap-2 mt-3 flex-wrap">
            <input ref={resumeFileRef} type="file" accept="application/pdf,.pdf" className="hidden" onChange={onResumeFile} />
            <button onClick={() => resumeFileRef.current && resumeFileRef.current.click()} className="px-3 py-1.5 rounded bg-white/15 text-white text-xs hover:bg-white/25">上传简历 PDF</button>
            {SITE.resumeData ? (
              <button onClick={() => { SITE.resumeData = ''; refresh(); showToast('已清除上传的简历'); }} className="px-2 py-1.5 rounded border border-white/20 text-white/60 text-xs hover:text-white">清除</button>
            ) : null}
            <span className="text-white/40 text-xs">{SITE.resumeData ? '已上传' : '未上传（下载按钮将指向 assets/resume.pdf）'}</span>
          </div>
        </div>
      )}

      {tab === 'images' && (
        <div>
          <h3 className="text-white/80 text-xs uppercase tracking-widest mb-2">封面与装饰图片（填 URL，右侧即时预览）</h3>
          <div className="mt-2" />
          <ImgInput label="About 装饰图 · 左上（月亮）" value={SITE.aboutImages && SITE.aboutImages.moon} onChange={(v) => setAboutImg('moon', v)} />
          <ImgInput label="About 装饰图 · 左下（物体）" value={SITE.aboutImages && SITE.aboutImages.object} onChange={(v) => setAboutImg('object', v)} />
          <ImgInput label="About 装饰图 · 右上（积木）" value={SITE.aboutImages && SITE.aboutImages.lego} onChange={(v) => setAboutImg('lego', v)} />
          <ImgInput label="About 装饰图 · 右下（组合）" value={SITE.aboutImages && SITE.aboutImages.group} onChange={(v) => setAboutImg('group', v)} />
          <label className="block text-white/70 text-xs mb-1 mt-4">首页轮播图（共 {SITE.marquee ? SITE.marquee.length : 0} 张）</label>
          {(SITE.marquee || []).map((m, i) => (
            <div key={i} className="flex items-center gap-2 bg-white/5 border border-white/10 rounded px-2 py-1.5 mt-1">
              {m && m.indexOf('data:') === 0 ? (
                <img src={m} alt="" className="w-10 h-10 rounded border border-white/20 object-cover shrink-0" />
              ) : (
                <span className="w-10 h-10 rounded border border-white/10 shrink-0 flex items-center justify-center text-white/25 text-xs">图</span>
              )}
              <span className="flex-1 truncate text-white/60 text-xs">{m && m.indexOf('data:') === 0 ? ('已内嵌图片（base64，约 ' + ((m.length / 1024).toFixed(0)) + ' KB）') : m}</span>
              <button onClick={() => { SITE.marquee = (SITE.marquee || []).filter((x) => x !== m); refresh(); showToast('已移除'); }} className="shrink-0 px-2 py-1 rounded bg-white/15 text-white text-xs hover:bg-white/25">移除</button>
            </div>
          ))}
          <div className="flex items-center gap-2 mt-2 flex-wrap">
            <input ref={marqueeFileRef} type="file" accept="image/*" multiple className="hidden" onChange={onMarqueeFile} />
            <button onClick={() => marqueeFileRef.current && marqueeFileRef.current.click()} className="px-3 py-1.5 rounded bg-white/15 text-white text-xs hover:bg-white/25">批量上传图片</button>
            <input value={marqueeUrl} onChange={(e) => setMarqueeUrl(e.target.value)} placeholder="或粘贴图片 URL（图床链接）" className={inputCls + ' flex-1 min-w-[180px]'} />
            <button onClick={() => { const v = marqueeUrl.trim(); if (!v) { showToast('请先粘贴图片 URL'); return; } SITE.marquee.push(v); setMarqueeUrl(''); refresh(); showToast('已添加 URL 轮播图'); }} className="px-3 py-1.5 rounded bg-white/15 text-white text-xs hover:bg-white/25">添加 URL</button>
            <span className="text-white/40 text-xs">URL 不占浏览器配额，可无限添加</span>
          </div>
        </div>
      )}

      {tab === 'fonts' && (
        <div>
          <h3 className="text-white/80 text-xs uppercase tracking-widest mb-2">全站字体</h3>
          <label className="block text-white/70 text-xs mb-1">字体（切换后即时生效）</label>
          <select className={inputCls} value={SITE.fontFamily || 'Kanit'} onChange={(e) => setFont(e.target.value)}>
            {fontOptions().map((o) => (
              <option key={o.family} value={o.family}>{o.label}</option>
            ))}
          </select>
          <p className="text-white/50 text-xs mt-2 leading-relaxed">
            中英文混排建议选择「思源黑体」；拉丁文字可选 Kanit / Space Grotesk / Montserrat / Poppins / Inter。
            字体选择随配置一起保存、导出。
          </p>
        </div>
      )}

      {tab === 'services' && (
        <div>
          <h3 className="text-white/80 text-xs uppercase tracking-widest mb-2">服务卡片</h3>
          {SITE.services.map((s, i) => (
            <div key={i} className="mb-3 p-2 rounded bg-white/5">
              <input className={inputCls} placeholder="编号" value={s.num} onChange={(e) => setService(i, 'num', e.target.value)} />
              <input className={inputCls} placeholder="名称" value={s.name} onChange={(e) => setService(i, 'name', e.target.value)} />
              <textarea className={inputCls} rows={2} placeholder="描述" value={s.desc} onChange={(e) => setService(i, 'desc', e.target.value)} />
              <button onClick={() => delService(i)} className="mt-1 text-red-400 text-xs">删除该服务</button>
            </div>
          ))}
          <button onClick={addService} className="text-[#9fd3ff] text-xs">+ 添加服务</button>
        </div>
      )}

      {tab === 'projects' && (
        <div>
          <h3 className="text-white/80 text-xs uppercase tracking-widest mb-2">项目卡片</h3>
          {SITE.projects.map((p, i) => (
            <div key={i} className="mb-3 p-2 rounded bg-white/5">
              <div className="flex gap-2">
                <input className={inputCls} placeholder="编号" value={p.num} onChange={(e) => setProject(i, 'num', e.target.value)} />
                <input className={inputCls} placeholder="分类" value={p.category} onChange={(e) => setProject(i, 'category', e.target.value)} />
              </div>
              <input className={inputCls} placeholder="项目名称" value={p.name} onChange={(e) => setProject(i, 'name', e.target.value)} />
              <label className="block text-white/60 text-xs mb-1 mt-2">项目描述（详情弹窗文字）</label>
              <textarea className={inputCls + ' min-h-[64px] resize-y'} placeholder="项目描述（详情弹窗展示）" value={p.desc || ''} onChange={(e) => setProject(i, 'desc', e.target.value)} />
              <label className="block text-white/60 text-xs mb-1 mt-2">首页卡片预览图</label>
              <ImgInput label="左列图 1" value={p.col1[0]} onChange={(v) => setProjectImg(i, 0, v)} />
              <ImgInput label="左列图 2" value={p.col1[1]} onChange={(v) => setProjectImg(i, 1, v)} />
              <ImgInput label="右侧大图" value={p.col2} onChange={(v) => setProject(i, 'col2', v)} />
              <label className="block text-white/60 text-xs mb-1 mt-2">详情画廊图（共 {(p.gallery || []).length} 张）</label>
              {(p.gallery || []).map((g, gi) => (
                <div key={gi} className="flex items-center gap-2 bg-white/5 border border-white/10 rounded px-2 py-1.5 mt-1">
                  {g && g.indexOf('data:') === 0 ? (
                    <img src={g} alt="" className="w-10 h-10 rounded border border-white/20 object-cover shrink-0" />
                  ) : (
                    <span className="w-10 h-10 rounded border border-white/10 shrink-0 flex items-center justify-center text-white/25 text-xs">图</span>
                  )}
                  <span className="flex-1 truncate text-white/60 text-xs">{g && g.indexOf('data:') === 0 ? ('已内嵌图片（base64，约 ' + ((g.length / 1024).toFixed(0)) + ' KB）') : g}</span>
                  <button onClick={() => { SITE.projects[i].gallery = (SITE.projects[i].gallery || []).filter((x) => x !== g); refresh(); }} className="shrink-0 px-2 py-1 rounded bg-white/15 text-white text-xs hover:bg-white/25">移除</button>
                </div>
              ))}
              <div className="flex items-center gap-2 mt-1">
                <input id={'gfile-' + i} type="file" accept="image/*" multiple className="hidden" onChange={(e) => onGalleryFile(i, e)} />
                <button onClick={() => { const el = document.getElementById('gfile-' + i); if (el) el.click(); }} className="px-3 py-1.5 rounded bg-white/15 text-white text-xs hover:bg-white/25">批量上传画廊图</button>
                <span className="text-white/40 text-xs">可多选，自动追加</span>
              </div>
              <button onClick={() => delProject(i)} className="mt-1 text-red-400 text-xs">删除该项目</button>
            </div>
          ))}
          <button onClick={addProject} className="text-[#9fd3ff] text-xs">+ 添加项目</button>
        </div>
      )}

      <div className="flex gap-2 mt-6 flex-wrap">
        <button onClick={saveLocal} className="bg-[#d7e2ea] text-black text-xs px-3 py-2 rounded">保存到本机</button>
        <button onClick={deployHTML} className="bg-[#9478FF]/25 text-[#cfd4ff] text-xs px-3 py-2 rounded border border-[#9478FF]/50">生成最新HTML</button>
        <button onClick={exportJSON} className="border border-white/30 text-white text-xs px-3 py-2 rounded">导出配置JSON</button>
        <button onClick={importJSON} className="border border-white/30 text-white text-xs px-3 py-2 rounded">导入配置JSON</button>
        <button onClick={resetAll} className="border border-white/30 text-white/60 text-xs px-3 py-2 rounded">恢复默认</button>
      </div>
    </div>
  );
};


/* ============================================================
   ContactSection — 结尾自我介绍/联系页（浅米色 CONTACT 排版）
   ============================================================ */
const ContactSection = () => {
  const copy = (val, label) => {
    const done = () => showToast(label + ' 已复制');
    const fallback = () => {
      const ta = document.createElement('textarea');
      ta.value = val;
      ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (err) { showToast('复制失败，请手动复制'); }
      document.body.removeChild(ta);
    };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(val).then(done, fallback);
    } else fallback();
  };
  return (
    <section id="contact" className="relative bg-[#0C0C0C] text-[#D7E2EA] px-6 md:px-10 py-24 sm:py-32 md:py-40 overflow-x-clip">
      {/* 顶部发丝线 + 品牌辉光 */}
      <div className="absolute inset-x-0 top-0 h-px bg-gradient-to-r from-transparent via-[#646973]/60 to-transparent" aria-hidden="true" />
      <div className="absolute left-1/2 -translate-x-1/2 top-0 h-[420px] w-[70%] pointer-events-none" aria-hidden="true" style={{ background: 'radial-gradient(60% 60% at 50% 0%, rgba(100,105,115,0.18) 0%, transparent 70%)' }} />
      <div className="relative max-w-[1320px] mx-auto flex flex-col lg:flex-row lg:items-center lg:justify-between gap-12 lg:gap-16">
        <div className="max-w-[620px]">
          <FadeIn as="p" delay={0} y={16} className="text-[#646973] font-medium uppercase tracking-[0.35em] text-sm mb-6">CONTACT</FadeIn>
          <FadeIn as="h2" delay={0.1} y={24} className="hero-heading font-black uppercase leading-[1.05] text-[clamp(2.6rem,7vw,6.5rem)]">{SITE.contactHeading || '一起做一个更会的想法。'}</FadeIn>
          <FadeIn as="p" delay={0.2} y={16} className="mt-6 text-[#D7E2EA]/60 text-lg sm:text-xl leading-relaxed max-w-[460px]">{SITE.contactDesc || '欢迎联系求职机会、项目合作或作品集交流。'}</FadeIn>
        </div>
        <div className="flex flex-col gap-4 w-full max-w-[520px]">
          <FadeIn delay={0.15} y={20}>
            <div className="flex items-center justify-between gap-4 rounded-full border-2 border-[#646973]/60 bg-white/5 px-6 sm:px-8 py-4 sm:py-5">
              <span className="text-base sm:text-lg tracking-wide truncate text-[#D7E2EA]">{SITE.contactPhone || '13253528395'}</span>
              <button onClick={() => copy(SITE.contactPhone || '13253528395', '电话')} className="shrink-0 text-sm sm:text-base text-[#BBCCD7] underline underline-offset-4 decoration-[#BBCCD7]/40 hover:decoration-[#BBCCD7] transition-colors">复制电话</button>
            </div>
          </FadeIn>
          <FadeIn delay={0.25} y={20}>
            <div className="flex items-center justify-between gap-4 rounded-full border-2 border-[#646973]/60 bg-white/5 px-6 sm:px-8 py-4 sm:py-5">
              <span className="text-base sm:text-lg tracking-wide truncate text-[#D7E2EA]">{SITE.contactEmail || '2196618702@qq.com'}</span>
              <button onClick={() => copy(SITE.contactEmail || '2196618702@qq.com', '邮箱')} className="shrink-0 text-sm sm:text-base text-[#BBCCD7] underline underline-offset-4 decoration-[#BBCCD7]/40 hover:decoration-[#BBCCD7] transition-colors">复制邮箱</button>
            </div>
          </FadeIn>
          <FadeIn delay={0.35} y={20}>
            <a
              href={SITE.resumeData || 'assets/resume.pdf'}
              download="resume.pdf"
              onClick={() => { if (!SITE.resumeData) showToast('如未开始下载，请在后台「基本 → 联系页」上传简历'); }}
              className="flex items-center justify-between gap-4 rounded-full border-2 border-[#646973]/60 bg-white/5 px-6 sm:px-8 py-4 sm:py-5 hover:bg-white/10 transition-colors"
            >
              <span className="text-base sm:text-lg tracking-wide text-[#D7E2EA]">下载简历</span>
              <span className="shrink-0 text-sm sm:text-base text-[#BBCCD7] underline underline-offset-4 decoration-[#BBCCD7]/40">{SITE.resumeData ? '已上传' : 'PDF'}</span>
            </a>
          </FadeIn>
        </div>
      </div>
    </section>
  );
};


/* ============================================================
   BackToTop — 主页右下角返回顶部箭头：向下翻过 50% 淡入出现，点击平滑回顶
   ============================================================ */
const BackToTop = () => {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => {
      const doc = document.documentElement;
      setShow(window.scrollY > doc.scrollHeight * 0.5);
    };
    onScroll();
    window.addEventListener('scroll', onScroll, { passive: true });
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <button
      type="button"
      aria-label="back to top"
      onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}
      className={`fixed bottom-8 right-8 z-50 w-12 h-12 rounded-full border-2 border-[#646973]/70 bg-[#0C0C0C]/85 backdrop-blur grid place-items-center text-[#D7E2EA] shadow-[0_10px_30px_rgba(0,0,0,.5)] transition-all duration-300 hover:border-[#BBCCD7] hover:bg-white/10 ${show ? 'opacity-100 translate-y-0 pointer-events-auto' : 'opacity-0 translate-y-3 pointer-events-none'}`}
    >
      <svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true">
        <path d="M4 11l5-5 5 5" stroke="currentColor" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
      </svg>
    </button>
  );
};

/* ============================================================
   App
   ============================================================ */
const App = () => {
  const [route, setRoute] = useState(readRoute);
  const [, setTick] = useState(0);

  const prevRoute = useRef(readRoute());
  useEffect(() => {
    const onHashChange = () => {
      const next = readRoute();
      const prev = prevRoute.current;
      prevRoute.current = next;
      setRoute(next);
      if (next.type === 'project') {
        window.scrollTo(0, 0);
      } else if (prev.type === 'project') {
        // 点 X / 浏览器返回：恢复到进入详情前的首页滚动位置
        let tries = 0;
        const restore = () => {
          if (tries < 10) { tries += 1; window.scrollTo(0, savedScrollY); requestAnimationFrame(restore); }
          else savedScrollY = 0;
        };
        requestAnimationFrame(restore);
      }
    };
    window.addEventListener('hashchange', onHashChange);
    return () => window.removeEventListener('hashchange', onHashChange);
  }, []);

  const projectList = SITE.projects || [];
  return (
    <div className="bg-[#0C0C0C] overflow-x-clip">
      {route.type === 'project' && projectList[route.index] ? (
        <ProjectDetail project={projectList[route.index]} />
      ) : (
        <main className="bg-[#0C0C0C] overflow-x-clip">
          <HeroSection />
          <MarqueeSection />
          <AboutSection />
          <ServicesSection />
          <ProjectsSection />
          <ContactSection />
          <BackToTop />
        </main>
      )}
      {/* 后台面板恒定挂载：切换页面路由（如打开 PROJECT 详情）时不退出 */}
      <AdminPanel onRefresh={() => setTick((t) => t + 1)} />
    </div>
  );
};

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
